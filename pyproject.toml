# Vantrilex Assistant OS — tool configuration.
[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored agent-harness content (skills/hooks/checkpoint) is not project source;
# upstream owns its formatting. archive/ holds relocated (non-executed) files.
extend-exclude = [".claude", "archive"]

# The live benchmark harness degrades every failure into a ScenarioResult FAIL
# row by design — it must never raise. Blind-except is its contract, not a smell.
[tool.ruff.lint.per-file-ignores]
"scripts/live_interactive_benchmark.py" = ["BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov=bridge --cov=common --cov-branch --cov-report=term-missing --cov-fail-under=85"
markers = ["live_probe: live infrastructure probes (fail-soft)", "live_harness: Phase-5 operational harnesses (fail-soft, never in CI)", "shadow: Tier-3 shadow tracer"]

[tool.coverage.run]
branch = true
source = ["src", "bridge", "common"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
