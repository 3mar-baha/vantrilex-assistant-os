# Vantrilex Assistant OS — tool configuration.
[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored agent-harness content (skills/hooks/checkpoint) is not project source;
# upstream owns its formatting.
extend-exclude = [".claude"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
