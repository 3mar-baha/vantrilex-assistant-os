# Vantrilex Assistant OS — tool configuration.
[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored agent-harness content (skills/hooks/checkpoint) is not project source;
# upstream owns its formatting.
extend-exclude = [".claude"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov=bridge --cov=common --cov-branch --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["src", "bridge", "common"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
