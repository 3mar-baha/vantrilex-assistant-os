name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    # Windows-native suite (Win32 ctypes, C:/D: telemetry, backslash paths).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg (voice contract tests)
        run: choco install ffmpeg --no-progress -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Clean Code Guard (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test Guard (pytest)
        run: python -m pytest -v

      - name: Security Gate (bandit + secret scan)
        run: python scripts/security_gate.py

      - name: Docs Guard
        run: python scripts/docs_guard.py
